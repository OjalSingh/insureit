# Runs the labelled-sample eval against the real model and posts the score table on the PR.
# It spends API credits, so it runs only on PRs labelled `run-eval` or by hand.
#
# One-time setup:
#   1. Add the ANTHROPIC_API_KEY repository secret.
#   2. Zip the images so the archive holds images/sample/... and upload it to a release:
#        cd dataset && zip -r ../images.zip images/sample && cd ..
#        gh release create eval-images images.zip --title "Eval images" --notes "Not code."
#   3. After the first good run on main, commit its numbers as the baseline:
#        python -m evaluation.gate evaluation/results/sample_metrics.json --update
name: Eval

on:
  pull_request:
    types: [opened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      tolerance:
        description: Allowed drop in claim_status accuracy (0.05 = 5 points, one claim of 20)
        default: "0.05"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-eval')
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check setup
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add the ANTHROPIC_API_KEY secret to run the eval."; exit 1
          fi
      - name: Fetch eval images
        run: |
          gh release download eval-images --pattern images.zip --dir /tmp
          unzip -q /tmp/images.zip -d dataset
      # Reviews are cached by prompt version, model and inputs, so re-runs with unchanged prompts
      # cost nothing.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: eval-${{ hashFiles('insureit/**', 'dataset/sample_claims.csv') }}
          restore-keys: eval-
      - name: Run eval
        run: python -m evaluation.evaluate
      - name: Gate on claim_status accuracy
        run: |
          python -m evaluation.gate evaluation/results/sample_metrics.json \
            --tolerance "${{ inputs.tolerance || '0.05' }}" --summary summary.md
      - name: Report
        if: always() && hashFiles('summary.md') != ''
        run: |
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file summary.md \
              --edit-last --create-if-none
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evaluation/results/
